<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPEN 9:00 - 11:00</title>
  <style>
    :root {
      --bg: #0b141a;
      --panel: #111b21;
      --panel-2: #202c33;
      --border: #2a3942;
      --text: #e9edef;
      --muted: #8696a0;
      --accent: #00a884;
      --accent-dark: #005c4b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 780px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    header {
      background: var(--panel-2);
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--text);
    }

    .sub {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      display: inline-block;
    }

    .conn-dot.online {
      background: var(--accent);
    }

    .conn-dot.offline {
      background: var(--danger);
    }

    .nick-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .nick-box input {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      width: 120px;
      font-size: 0.85rem;
      outline: none;
    }

    .nick-box input:focus {
      border-color: var(--accent);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
      background-size: 20px 20px;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      max-width: 280px;
      line-height: 1.5;
    }

    .msg {
      max-width: 78%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      word-break: break-word;
    }

    .msg.mine {
      align-self: flex-end;
      background: var(--accent-dark);
      border-color: #0b7a63;
    }

    .msg-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.72rem;
      color: rgba(233, 237, 239, 0.75);
      font-weight: 600;
    }

    .msg-text {
      font-size: 0.92rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .msg img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      display: block;
      object-fit: contain;
      background: rgba(0, 0, 0, 0.25);
    }

    .msg audio {
      width: 240px;
      max-width: 100%;
      height: 36px;
    }

    #preview-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      background: var(--panel-2);
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
    }

    #preview-bar.active {
      display: flex;
    }

    #preview-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    #preview-thumb {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    #preview-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .composer {
      background: var(--panel-2);
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #file-input {
      display: none;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1rem;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }

    .icon-btn:hover {
      border-color: var(--accent);
    }

    .icon-btn.recording {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    #text-input {
      flex: 1;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 14px;
      font-size: 0.92rem;
      outline: none;
    }

    #text-input:focus {
      border-color: var(--accent);
    }

    #rec-status {
      display: none;
      align-items: center;
      gap: 8px;
      flex: 1;
      font-size: 0.85rem;
      color: #fca5a5;
      padding: 0 6px;
    }

    #rec-status.active {
      display: flex;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
    }

    #send-btn {
      height: 40px;
      padding: 0 16px;
      border-radius: 20px;
      border: none;
      background: var(--accent);
      color: #06211a;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    #send-btn:hover {
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-wrap">
        <h1>OPEN 9:00 - 11:00</h1>
        <span class="sub">
          <span class="conn-dot" id="conn-dot"></span>
          <span id="conn-text">Conectando... · Sin historial</span>
        </span>
      </div>
      <div class="nick-box">
        <label for="nick-input">Tú:</label>
        <input id="nick-input" type="text" maxlength="20" value="Yo" />
      </div>
    </header>

    <main id="chat">
      <div class="empty" id="empty-state">
        Escribe un mensaje, envía una foto o graba una nota de voz. Nada queda guardado al cerrar o recargar.
      </div>
    </main>

    <div id="preview-bar">
      <div id="preview-left">
        <img id="preview-thumb" alt="Vista previa" />
        <span id="preview-name"></span>
      </div>
      <button type="button" class="btn-ghost" id="clear-photo-btn">Quitar</button>
    </div>

    <form class="composer" id="composer">
      <input type="file" id="file-input" accept="image/*" />
      <button type="button" class="icon-btn" id="photo-btn" title="Enviar foto">📷</button>

      <input type="text" id="text-input" placeholder="Escribe un mensaje..." autocomplete="off" />

      <div id="rec-status">
        <span class="dot"></span>
        <span id="rec-timer">00:00</span>
        <button type="button" class="btn-ghost" id="cancel-rec-btn">Cancelar</button>
      </div>

      <button type="button" class="icon-btn" id="mic-btn" title="Grabar audio">🎤</button>
      <button type="submit" id="send-btn">Enviar</button>
    </form>
  </div>

  <script>
    // Cambia a wss://TU-TUNEL cuando expongas el servidor WebSocket con HTTPS
    const WS_URL = "ws://localhost:8765";

    const chatEl = document.getElementById("chat");
    const emptyStateEl = document.getElementById("empty-state");
    const composerEl = document.getElementById("composer");
    const textInputEl = document.getElementById("text-input");
    const nickInputEl = document.getElementById("nick-input");
    const photoBtnEl = document.getElementById("photo-btn");
    const fileInputEl = document.getElementById("file-input");
    const previewBarEl = document.getElementById("preview-bar");
    const previewThumbEl = document.getElementById("preview-thumb");
    const previewNameEl = document.getElementById("preview-name");
    const clearPhotoBtnEl = document.getElementById("clear-photo-btn");
    const micBtnEl = document.getElementById("mic-btn");
    const recStatusEl = document.getElementById("rec-status");
    const recTimerEl = document.getElementById("rec-timer");
    const cancelRecBtnEl = document.getElementById("cancel-rec-btn");
    const connDotEl = document.getElementById("conn-dot");
    const connTextEl = document.getElementById("conn-text");

    // Todo vive únicamente en memoria de la pestaña actual
    let pendingPhotoDataUrl = null;
    let pendingPhotoName = "";
    let mediaRecorder = null;
    let audioChunks = [];
    let recInterval = null;
    let recSeconds = 0;
    let cancelRecording = false;
    let socket = null;
    let reconnectTimeout = null;
    const seenIds = new Set();

    function setConnectionStatus(state, label) {
      connDotEl.className = `conn-dot ${state}`;
      connTextEl.textContent = `${label} · Sin historial`;
    }

    function connectSocket() {
      clearTimeout(reconnectTimeout);
      setConnectionStatus("", "Conectando...");

      try {
        socket = new WebSocket(WS_URL);
      } catch {
        setConnectionStatus("offline", "Sin conexión");
        reconnectTimeout = setTimeout(connectSocket, 2500);
        return;
      }

      socket.onopen = () => {
        setConnectionStatus("online", "En vivo");
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (!data.id || seenIds.has(data.id)) return;
          seenIds.add(data.id);

          appendMessage({
            author: data.author,
            text: data.text,
            photoUrl: data.photoUrl,
            audioUrl: data.audioUrl,
            mine: false
          });
        } catch {
          // Ignorar paquetes malformados
        }
      };

      socket.onclose = () => {
        setConnectionStatus("offline", "Reconectando...");
        reconnectTimeout = setTimeout(connectSocket, 2500);
      };

      socket.onerror = () => {
        setConnectionStatus("offline", "Error de red");
      };
    }

    function sendLiveMessage({ author, text, photoUrl = null, audioUrl = null }) {
      const id = (crypto.randomUUID && crypto.randomUUID()) || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      seenIds.add(id);

      appendMessage({
        author,
        text,
        photoUrl,
        audioUrl,
        mine: true
      });

      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          id,
          author,
          text,
          photoUrl,
          audioUrl
        }));
      }
    }

    function formatTime(date = new Date()) {
      return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function formatDuration(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function appendMessage({ author, text, photoUrl, audioUrl, mine = true }) {
      if (emptyStateEl && emptyStateEl.isConnected) {
        emptyStateEl.remove();
      }

      const msgEl = document.createElement("div");
      msgEl.className = `msg ${mine ? "mine" : ""}`;

      const metaEl = document.createElement("div");
      metaEl.className = "msg-meta";

      const authorSpan = document.createElement("span");
      authorSpan.textContent = author || "Anónimo";

      const timeSpan = document.createElement("span");
      timeSpan.textContent = formatTime();

      metaEl.append(authorSpan, timeSpan);
      msgEl.appendChild(metaEl);

      if (photoUrl) {
        const imgEl = document.createElement("img");
        imgEl.src = photoUrl;
        imgEl.alt = "Foto enviada";
        msgEl.appendChild(imgEl);
      }

      if (audioUrl) {
        const audioEl = document.createElement("audio");
        audioEl.controls = true;
        audioEl.src = audioUrl;
        msgEl.appendChild(audioEl);
      }

      if (text) {
        const textEl = document.createElement("div");
        textEl.className = "msg-text";
        textEl.textContent = text;
        msgEl.appendChild(textEl);
      }

      chatEl.appendChild(msgEl);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function clearPendingPhoto() {
      pendingPhotoDataUrl = null;
      pendingPhotoName = "";
      fileInputEl.value = "";
      previewThumbEl.src = "";
      previewNameEl.textContent = "";
      previewBarEl.classList.remove("active");
    }

    photoBtnEl.addEventListener("click", () => fileInputEl.click());

    fileInputEl.addEventListener("change", () => {
      const file = fileInputEl.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        pendingPhotoDataUrl = reader.result;
        pendingPhotoName = file.name;
        previewThumbEl.src = pendingPhotoDataUrl;
        previewNameEl.textContent = pendingPhotoName;
        previewBarEl.classList.add("active");
      };
      reader.readAsDataURL(file);
    });

    clearPhotoBtnEl.addEventListener("click", clearPendingPhoto);

    composerEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = textInputEl.value.trim();
      const author = nickInputEl.value.trim() || "Yo";

      if (!text && !pendingPhotoDataUrl) return;

      sendLiveMessage({
        author,
        text,
        photoUrl: pendingPhotoDataUrl,
        audioUrl: null
      });

      textInputEl.value = "";
      clearPendingPhoto();
      textInputEl.focus();
    });

    function stopTimer() {
      clearInterval(recInterval);
      recInterval = null;
      recSeconds = 0;
      recTimerEl.textContent = "00:00";
    }

    function resetRecorderUI() {
      stopTimer();
      micBtnEl.classList.remove("recording");
      micBtnEl.textContent = "🎤";
      recStatusEl.classList.remove("active");
      textInputEl.style.display = "";
      photoBtnEl.style.display = "";
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function startRecording() {
      if (!navigator.mediaDevices?.getUserMedia) {
        alert("Tu navegador no soporta grabación de audio aquí (requiere HTTPS o localhost).");
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        cancelRecording = false;
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach((track) => track.stop());

          if (!cancelRecording && audioChunks.length > 0) {
            const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
            const audioDataUrl = await blobToDataUrl(blob);
            const author = nickInputEl.value.trim() || "Yo";
            sendLiveMessage({ author, text: "", photoUrl: null, audioUrl: audioDataUrl });
          }

          audioChunks = [];
          mediaRecorder = null;
          resetRecorderUI();
        };

        mediaRecorder.start();
        micBtnEl.classList.add("recording");
        micBtnEl.textContent = "⏹";
        textInputEl.style.display = "none";
        photoBtnEl.style.display = "none";
        recStatusEl.classList.add("active");

        recInterval = setInterval(() => {
          recSeconds += 1;
          recTimerEl.textContent = formatDuration(recSeconds);
        }, 1000);
      } catch (err) {
        alert("No se pudo acceder al micrófono.");
        resetRecorderUI();
      }
    }

    micBtnEl.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        cancelRecording = false;
        mediaRecorder.stop();
      } else {
        startRecording();
      }
    });

    cancelRecBtnEl.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        cancelRecording = true;
        mediaRecorder.stop();
      } else {
        resetRecorderUI();
      }
    });

    connectSocket();
  </script>
</body>
</html>
