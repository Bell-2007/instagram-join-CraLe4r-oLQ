<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPEN 9:00 - 11:00</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          },
          colors: {
            terminal: {
              bg: '#090b0e',
              panel: '#0e1116',
              elevated: '#141920',
              border: '#1f2630',
              text: '#d8dee9',
              muted: '#7b8494',
              accent: '#4ade80',
              accentDim: '#166534',
              warn: '#f59e0b',
              danger: '#f87171'
            }
          }
        }
      }
    };
  </script>
  <style>
    /* Estilo minimalista de barra de desplazamiento en modo terminal */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090b0e;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2630;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2f3947;
    }

    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor-blink {
      animation: blinkCursor 1.1s infinite;
    }
  </style>
</head>
<body class="bg-terminal-bg text-terminal-text font-mono antialiased min-h-screen flex flex-col selection:bg-terminal-accent/20 selection:text-terminal-accent">
  <!-- Contenedor principal centrado y adaptable a cualquier pantalla -->
  <div class="w-full max-w-4xl mx-auto flex-1 flex flex-col px-3 sm:px-6 py-4 sm:py-6">

    <!-- Encabezado principal de la terminal -->
    <header class="bg-terminal-panel border border-terminal-border rounded-xl px-4 py-3.5 sm:px-5 sm:py-4 mb-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <span class="inline-flex h-2.5 w-2.5 rounded-full bg-terminal-accent shrink-0" aria-hidden="true"></span>
        <div class="min-w-0">
          <h1 class="text-base sm:text-xl font-bold tracking-wider text-white truncate">
            OPEN 9:00 - 11:00
          </h1>
          <p class="text-xs text-terminal-muted truncate">
            sesion efimera en memoria · sin historial persistente
          </p>
        </div>
      </div>

      <div class="flex items-center justify-between sm:justify-end gap-2.5">
        <span id="msgCounter" class="text-xs text-terminal-muted bg-terminal-bg border border-terminal-border rounded-lg px-2.5 py-1.5">
          0 msgs
        </span>
        <button
          id="clearBtn"
          type="button"
          class="text-xs font-medium text-terminal-muted hover:text-terminal-danger bg-terminal-bg hover:bg-terminal-elevated border border-terminal-border hover:border-terminal-danger/40 rounded-lg px-3 py-1.5 transition-colors cursor-pointer"
          title="Borrar vista local de esta sesión"
        >
          limpiar vista
        </button>
      </div>
    </header>

    <!-- Aviso sutil de estado o notificaciones internas (nunca alert/confirm) -->
    <div id="statusBanner" class="hidden mb-3 text-xs rounded-lg px-3.5 py-2 border border-terminal-border bg-terminal-elevated text-terminal-muted flex items-center justify-between gap-2" role="status" aria-live="polite">
      <span id="statusText"></span>
      <button id="dismissStatusBtn" type="button" class="text-terminal-muted hover:text-white px-1 cursor-pointer" aria-label="Cerrar aviso">
        ×
      </button>
    </div>

    <!-- Área de mensajes en memoria de sesión -->
    <main
      id="chatContainer"
      class="flex-1 bg-terminal-panel border border-terminal-border rounded-xl p-3.5 sm:p-5 overflow-y-auto flex flex-col gap-2.5 min-h-[340px] max-h-[62vh] sm:max-h-[66vh]"
      aria-label="Mensajes del chat"
    >
      <div id="emptyState" class="my-auto text-center py-10 px-4 select-none">
        <p class="text-xs sm:text-sm text-terminal-muted">
          <span class="text-terminal-accent">$</span> esperando mensajes en esta sesion...
          <span class="cursor-blink text-terminal-accent">_</span>
        </p>
        <p class="text-[11px] text-terminal-muted/70 mt-1.5">
          todo lo que escribas vive unicamente en la memoria activa de esta pestana.
        </p>
      </div>
    </main>

    <!-- Formulario inferior: apodo, caja de mensaje y botón enviar -->
    <form id="chatForm" class="mt-3 bg-terminal-panel border border-terminal-border rounded-xl p-3 sm:p-3.5 flex flex-col gap-2.5" novalidate>
      <div class="flex flex-col sm:flex-row gap-2.5">
        <!-- Campo de apodo -->
        <div class="w-full sm:w-48 shrink-0 flex items-center bg-terminal-bg border border-terminal-border focus-within:border-terminal-accent rounded-lg px-3 transition-colors">
          <span class="text-xs text-terminal-accent mr-2 select-none">@</span>
          <input
            id="nickInput"
            type="text"
            maxlength="24"
            placeholder="apodo"
            aria-label="Apodo"
            autocomplete="off"
            spellcheck="false"
            class="w-full bg-transparent py-2.5 text-xs sm:text-sm text-white placeholder-terminal-muted/60 focus:outline-none"
          />
        </div>

        <!-- Campo de mensaje -->
        <div class="flex-1 flex items-center bg-terminal-bg border border-terminal-border focus-within:border-terminal-accent rounded-lg px-3 transition-colors">
          <span class="text-xs text-terminal-muted mr-2 select-none">&gt;</span>
          <input
            id="messageInput"
            type="text"
            maxlength="500"
            placeholder="escribe un mensaje..."
            aria-label="Mensaje"
            autocomplete="off"
            class="w-full bg-transparent py-2.5 text-xs sm:text-sm text-white placeholder-terminal-muted/60 focus:outline-none"
          />
        </div>

        <!-- Botón enviar -->
        <button
          id="sendBtn"
          type="submit"
          class="w-full sm:w-auto shrink-0 bg-terminal-accent/15 hover:bg-terminal-accent/25 active:bg-terminal-accent/30 text-terminal-accent border border-terminal-accent/50 font-semibold text-xs sm:text-sm rounded-lg px-5 py-2.5 transition-colors cursor-pointer"
        >
          enviar
        </button>
      </div>

      <div class="flex items-center justify-between text-[11px] text-terminal-muted/75 px-0.5">
        <span>enter para enviar · sin almacenamiento en disco</span>
        <span id="charCount">0/500</span>
      </div>
    </form>

  </div>

  <script>
    (function () {
      'use strict';

      // Estado exclusivo en memoria de la sesión actual.
      // No se lee ni escribe en localStorage, sessionStorage, cookies ni bases de datos externas.
      const sessionMessages = [];

      // Referencias del DOM
      const chatForm = document.getElementById('chatForm');
      const nickInput = document.getElementById('nickInput');
      const messageInput = document.getElementById('messageInput');
      const chatContainer = document.getElementById('chatContainer');
      const emptyState = document.getElementById('emptyState');
      const clearBtn = document.getElementById('clearBtn');
      const msgCounter = document.getElementById('msgCounter');
      const charCount = document.getElementById('charCount');
      const statusBanner = document.getElementById('statusBanner');
      const statusText = document.getElementById('statusText');
      const dismissStatusBtn = document.getElementById('dismissStatusBtn');

      let statusTimeout = null;

      /**
       * Muestra un aviso breve en pantalla sin usar alert() ni confirm().
       * @param {string} text
       * @param {'info'|'warn'} [type='info']
       */
      function showStatus(text, type) {
        try {
          if (!statusBanner || !statusText) return;
          statusText.textContent = text;
          statusBanner.classList.remove('hidden');
          statusBanner.classList.toggle('border-terminal-warn/50', type === 'warn');
          statusBanner.classList.toggle('text-terminal-warn', type === 'warn');
          statusBanner.classList.toggle('border-terminal-border', type !== 'warn');
          statusBanner.classList.toggle('text-terminal-muted', type !== 'warn');

          if (statusTimeout) {
            clearTimeout(statusTimeout);
          }
          statusTimeout = setTimeout(hideStatus, 3200);
        } catch (err) {
          console.error('Error al mostrar estado:', err);
        }
      }

      /**
       * Oculta el banner de estado.
       */
      function hideStatus() {
        if (statusBanner) {
          statusBanner.classList.add('hidden');
        }
      }

      /**
       * Formatea la hora actual en HH:MM:SS para la marca de tiempo del mensaje.
       * @param {Date} date
       * @returns {string}
       */
      function formatTimestamp(date) {
        const hh = String(date.getHours()).padStart(2, '0');
        const mm = String(date.getMinutes()).padStart(2, '0');
        const ss = String(date.getSeconds()).padStart(2, '0');
        return `${hh}:${mm}:${ss}`;
      }

      /**
       * Normaliza el apodo del usuario.
       * @param {string} rawNick
       * @returns {string}
       */
      function sanitizeNickname(rawNick) {
        const cleaned = (rawNick || '').trim().replace(/\s+/g, '_');
        return cleaned || 'anon';
      }

      /**
       * Actualiza el contador de mensajes de la sesión.
       */
      function updateCounter() {
        const count = sessionMessages.length;
        msgCounter.textContent = `${count} ${count === 1 ? 'msg' : 'msgs'}`;
        emptyState.classList.toggle('hidden', count > 0);
      }

      /**
       * Renderiza todos los mensajes almacenados únicamente en sessionMessages.
       */
      function renderMessages() {
        try {
          // Elimina nodos de mensaje previos preservando emptyState
          const existingRows = chatContainer.querySelectorAll('[data-msg-row="true"]');
          existingRows.forEach((row) => row.remove());

          for (let i = 0; i < sessionMessages.length; i += 1) {
            const item = sessionMessages[i];
            const row = document.createElement('div');
            row.setAttribute('data-msg-row', 'true');
            row.className = 'group bg-terminal-bg/80 hover:bg-terminal-elevated/70 border border-terminal-border/70 rounded-lg px-3 py-2 text-xs sm:text-sm leading-relaxed break-words transition-colors';

            const meta = document.createElement('div');
            meta.className = 'flex items-center justify-between gap-2 text-[11px] text-terminal-muted mb-0.5';

            const sender = document.createElement('span');
            sender.className = 'font-semibold text-terminal-accent';
            sender.textContent = `@${item.nickname}`;

            const time = document.createElement('span');
            time.className = 'tabular-nums text-terminal-muted/80 shrink-0';
            time.textContent = item.time;

            const body = document.createElement('p');
            body.className = 'text-terminal-text whitespace-pre-wrap break-words';
            body.textContent = item.text;

            meta.appendChild(sender);
            meta.appendChild(time);
            row.appendChild(meta);
            row.appendChild(body);
            chatContainer.appendChild(row);
          }

          updateCounter();
          chatContainer.scrollTop = chatContainer.scrollHeight;
        } catch (err) {
          console.error('Error al renderizar mensajes:', err);
          showStatus('No se pudo actualizar la vista de mensajes.', 'warn');
        }
      }

      /**
       * Agrega un mensaje nuevo a la memoria de la sesión actual.
       * @param {string} nickname
       * @param {string} text
       */
      function appendSessionMessage(nickname, text) {
        try {
          sessionMessages.push({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            nickname,
            text,
            time: formatTimestamp(new Date())
          });
          renderMessages();
        } catch (err) {
          console.error('Error al agregar mensaje en memoria:', err);
          showStatus('Ocurrió un error al enviar el mensaje.', 'warn');
        }
      }

      /**
       * Limpia por completo los mensajes de la memoria de sesión y la vista actual.
       */
      function clearSessionView() {
        try {
          sessionMessages.length = 0;
          renderMessages();
          showStatus('Vista local limpiada. Memoria de sesión vacía.', 'info');
          messageInput.focus();
        } catch (err) {
          console.error('Error al limpiar la vista:', err);
          showStatus('No se pudo limpiar la vista.', 'warn');
        }
      }

      // Eventos del formulario
      chatForm.addEventListener('submit', function (event) {
        event.preventDefault();
        const text = messageInput.value.trim();
        if (!text) {
          showStatus('Escribe un mensaje antes de enviar.', 'warn');
          messageInput.focus();
          return;
        }

        const nickname = sanitizeNickname(nickInput.value);
        appendSessionMessage(nickname, text);

        messageInput.value = '';
        charCount.textContent = `0/${messageInput.maxLength}`;
        messageInput.focus();
      });

      // Contador de caracteres en vivo
      messageInput.addEventListener('input', function () {
        charCount.textContent = `${messageInput.value.length}/${messageInput.maxLength}`;
      });

      // Botón limpiar vista
      clearBtn.addEventListener('click', clearSessionView);

      // Cerrar aviso de estado
      dismissStatusBtn.addEventListener('click', hideStatus);

      // Foco inicial en el campo de mensaje para escritura rápida
      window.addEventListener('DOMContentLoaded', function () {
        renderMessages();
        messageInput.focus();
      });
    })();
  </script>
</body>
</html>
